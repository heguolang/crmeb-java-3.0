server
{
    listen 80;
    # 强制 HTTPS —— 必须限定 $scheme = http，
    # 否则该 server 块同时管 80 和 443，https 请求会被 301 到自己形成死循环。
    # 同时放行 ACME 校验路径，避免续期时「证书已失效 -> 验证走 443 -> 证书无效」死锁。
    set $qf_redirect "";
    if ($scheme = http) { set $qf_redirect "1"; }
    if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $qf_redirect ""; }
    if ($qf_redirect = "1") { return 301 https://$host$request_uri; }
    listen 443 ssl ;
    http2 on;
    ssl_certificate /www/server/panel/vhost/cert/apiqf.qianxutec.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/apiqf.qianxutec.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL_qf:10m;
    server_name apiqf.qianxutec.com;
    index index.html index.htm;
    root /www/wwwroot/apiqf.qianxutec.com;
    include /www/server/panel/vhost/nginx/extension/apiqf.qianxutec.com/*.conf;
    # ACME 域名校验（Let's Encrypt）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-challenge;
        default_type text/plain;
        access_log off;
    }

    client_max_body_size 100m;

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.vscode|\.idea|\.ssh|\.github|node_modules|runtime)/ {
        return 404;
    }

    # ===== 反代开始 =====
    # 后台登录验证码：safety 在 admin 模块，需转发 21800
    location ~* ^/api/public/safety/ {
        proxy_pass http://127.0.0.1:21800;
        proxy_set_header Host $host;
    }
    # 移动端 API → Qianxu-front.jar (21810)
    location ~ ^/api/(front|public)/ {
        proxy_pass http://127.0.0.1:21810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    # 管理端 API + 图片等其余请求 → Qianxu-admin.jar (21800)
    location / {
        proxy_pass http://127.0.0.1:21800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    # ===== 反代结束 =====

    access_log  /www/wwwlogs/apiqf.qianxutec.com.log;
    error_log  /www/wwwlogs/apiqf.qianxutec.com.error.log;
}
