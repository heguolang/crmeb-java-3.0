# 黔序商城 - 一客户一套标准编排
# 用法见 deploy/README.md
#
# 目录（相对本文件）：
#   .env                 客户配置（从 .env.example 复制）
#   data/mysql           MySQL 数据
#   data/redis           Redis 数据
#   data/qianxu          上传文件（qianxuimage）
#   sql/init             首次启动自动导入的 .sql（可选）

services:
  mysql:
    image: mysql:8.0.36
    container_name: ${COMPOSE_PROJECT_NAME:-qianxu}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qianxu}
      MYSQL_USER: ${MYSQL_USER:-qianxu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-qianxu}_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin:
    image: qianxu-admin:${IMAGE_TAG:-3.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-qianxu}_admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS_ADMIN}
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-qianxu}?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-qianxu}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_REDIS_DATABASE: ${REDIS_DB_ADMIN:-10}
      SPRING_REDIS_SECOND_DATABASE: ${REDIS_DB_ADMIN_SECOND:-14}
      QIANXU_IMAGEPATH: ${QIANXU_IMAGE_PATH:-/data/qianxu/}
      QIANXU_DEMOSITE: ${QIANXU_DEMO_SITE:-false}
    volumes:
      - ./data/qianxu:/data/qianxu
      - ./data/logs/admin:/app/logs
      - ./data/logs/admin-app:/app/qianxu_log
    # 生产建议注释掉，仅经 nginx 暴露
    # ports:
    #   - "${ADMIN_API_PORT:-8080}:8080"

  front:
    image: qianxu-front:${IMAGE_TAG:-3.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-qianxu}_front
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS_FRONT}
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-qianxu}?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-qianxu}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_REDIS_DATABASE: ${REDIS_DB_FRONT:-11}
      SPRING_REDIS_SECOND_DATABASE: ${REDIS_DB_FRONT_SECOND:-13}
      QIANXU_IMAGEPATH: ${QIANXU_IMAGE_PATH:-/data/qianxu/}
      QIANXU_DEMOSITE: ${QIANXU_DEMO_SITE:-false}
    volumes:
      - ./data/qianxu:/data/qianxu
      - ./data/logs/front:/app/logs
      - ./data/logs/front-app:/app/qianxu_log
    # ports:
    #   - "${FRONT_API_PORT:-8081}:8081"

  nginx:
    image: qianxu-admin-web:${IMAGE_TAG:-3.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-qianxu}_nginx
    restart: unless-stopped
    depends_on:
      - admin
      - front
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./data/qianxu:/data/qianxu:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
