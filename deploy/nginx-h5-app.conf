# ============================================================
# CRMEB H5（uni-app history 模式）Nginx 配置片段
# 站点：app.qianxutec.com
# 根因：刷新 /pages/xxx 时 nginx 找物理文件 → 404
# 把下面 location / 配到宝塔「网站设置 → 配置文件」里，
# 覆盖原有 location /（或合并进现有 server）
# ============================================================

server {
    listen 80;
    server_name app.qianxutec.com;
    root /www/wwwroot/app.qianxutec.com;
    index index.html;

    # H5 SPA：任意路径都回落到 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源可长期缓存（按需）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 若 H5 同源反代 API，可按需打开（当前 H5 直连 api.qianxutec.com 则不用）
    # location /api/ {
    #     proxy_pass http://127.0.0.1:21710/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
