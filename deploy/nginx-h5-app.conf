# ============================================================
# QIANXU H5 Nginx（app.qianxutec.com）
#
# 【推荐做法二选一】
# A) 前端已改为 hash 路由（manifest.json mode=hash）：
#    地址栏为 /#/pages/... ，刷新不会 404，可不用 try_files
# B) 仍用 history 路由：必须配置下面 location /
#
# 宝塔操作：网站设置 → 配置文件，找到 location / 改成 try_files；
# 或「伪静态」粘贴 deploy/baota-h5-rewrite.conf 内容后重载
# ============================================================

server {
    listen 80;
    server_name app.qianxutec.com;
    root /www/wwwroot/app.qianxutec.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}
