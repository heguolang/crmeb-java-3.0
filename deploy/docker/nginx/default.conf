# 管理端同域：静态页 + /api → admin 容器
# 会员 API：/fapi/ → front 容器（去掉 /fapi 前缀后转发）
# 小程序/H5 若直连 front，也可在下方 server 或另开域名

upstream qianxu_admin_api {
    server admin:8080;
}

upstream qianxu_front_api {
    server front:8081;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    charset utf-8;

    # 后台前端
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 图标字体：避免 MIME/缓存异常导致顶栏 el-icon 显示成乱码字符
    location ~* \.(woff2?|ttf|eot|otf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, immutable";
        types {
            application/font-woff2 woff2;
            application/font-woff woff;
            font/ttf ttf;
            application/vnd.ms-fontobject eot;
            font/otf otf;
        }
        default_type application/octet-stream;
    }

    # 后台 / 公共 API（与 jar 内 path 一致）
    location /api/ {
        proxy_pass http://qianxu_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # 会员端 API：浏览器或网关用 https://域名/fapi/api/front/...
    # 若 App 配置基址为 https://域名/fapi ，则完整路径为 /fapi/api/...
    location /fapi/ {
        proxy_pass http://qianxu_front_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # 上传图片等（imagePath 映射到 /data/qianxu）
    location /qianxuimage/ {
        alias /data/qianxu/qianxuimage/;
        expires 7d;
        access_log off;
    }
}
